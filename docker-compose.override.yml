services:
  migrate:
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/brightbean

  app:
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/brightbean

  worker:
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/brightbean

  postgres:
    # Dev convenience only: reachable from the host for psql/IDE, never from
    # the network. Production (docker-compose.prod.yml) publishes no DB port.
    # If a local PostgreSQL already uses 5432, set POSTGRES_HOST_PORT=5433 in .env.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  tailwind:
    image: node:20-slim
    working_dir: /app/theme/static_src
    command: sh -c "npm ci && npm run start"
    volumes:
      - .:/app
      - tailwind_node_modules:/app/theme/static_src/node_modules
    init: true
    tty: true
    restart: unless-stopped

volumes:
  tailwind_node_modules:
